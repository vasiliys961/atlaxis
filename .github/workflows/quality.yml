name: ATLAXIS Quality Gate

on:
  push:
    branches: ["main", "clinical-reasoning-rebuild"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Temporary lockfile recovery
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo LOCKFILE_BASE64_BEGIN
          base64 -w0 package-lock.json
          echo
          echo LOCKFILE_BASE64_END
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
