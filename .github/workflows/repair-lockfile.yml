name: Repair dependency lockfile

on:
  push:
    branches: ["clinical-reasoning-rebuild"]
    paths:
      - "package.json"
      - ".github/workflows/repair-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'vasiliys961/atlaxis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: synchronize npm dependency lockfile"
          git push origin HEAD:clinical-reasoning-rebuild
